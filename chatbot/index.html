
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .question {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            padding: 15px;
            margin-top: 12px;
            overflow-wrap: anywhere;
        }

        .question p {
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<header>
    <h1>Technická podpora</h1>
    <p>Rychlá pomoc s technickými problémy</p>
</header>

<main>

    <form id="Form">

        <div class="box">
            <label for="dotaz">Váš dotaz</label>
            <textarea id="dotaz"
                placeholder="Napište svůj dotaz..."
                required></textarea>
        </div>

        <div class="box">
            <label for="email">E-mail (nepovinný)</label>
            <input type="email" id="email"
                placeholder="vas@email.cz">
        </div>

        <button type="submit">Odeslat dotaz</button>

    </form>

    <div class="box">
        <h2>Odpověď podpory</h2>
        <div id="odpoved">
            <p id="prazdnaZprava">Zatím žádný dotaz.</p>
        </div>
    </div>

</main>

<script>
    const form = document.getElementById("Form");
    const dotazInput = document.getElementById("dotaz");
    const emailInput = document.getElementById("email");
    const odpoved = document.getElementById("odpoved");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const dotaz = dotazInput.value.trim();
        const email = emailInput.value.trim();

        if (dotaz === "") {
            alert("Napište svůj dotaz.");
            return;
        }

        // Odstraníme výchozí zprávu.
        const prazdnaZprava =
            document.getElementById("prazdnaZprava");

        if (prazdnaZprava) {
            prazdnaZprava.remove();
        }

        // Vytvoříme kartu s dotazem.
        const karta = document.createElement("div");
        karta.className = "question";

        const nadpisDotazu = document.createElement("strong");
        nadpisDotazu.textContent = "Váš dotaz:";

        const textDotazu = document.createElement("p");
        textDotazu.textContent = dotaz;

        const nadpisEmailu = document.createElement("strong");
        nadpisEmailu.textContent = "E-mail:";

        const textEmailu = document.createElement("p");
        textEmailu.textContent = email || "Neuveden";

        karta.appendChild(nadpisDotazu);
        karta.appendChild(textDotazu);
        karta.appendChild(nadpisEmailu);
        karta.appendChild(textEmailu);

        // Zobrazíme dotaz v sekci Odpověď podpory.
        odpoved.prepend(karta);

        // Vymažeme formulář.
        form.reset();
    });
</script>

</body>
</html>
