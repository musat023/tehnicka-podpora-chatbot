    <title>Technická podpora - </title>
</head>
<body>
<header>
    <h1>Technická podpora</h1>
    <p>Rychlá pomoc s technickými problémy</p>
</header>

<main>
    <h2>Potřebujete pomoc?</h2>

    <p>
        Napište nám svůj problém a my se na něj podíváme.
    </p>

    <form id="Form">

        <label>Váš dotaz:</label>
        <textarea id="dotaz" required></textarea>


        <label>E-mail</label>
        <input type="email" id="email" required>

        <button>Odeslat dotaz</button>
        
        <h2>Odpověď podpory:</h2>
        <label>Zatím žádný dotaz.</label>

    </form>
  
</div>
